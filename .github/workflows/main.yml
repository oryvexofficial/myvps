name: Windows Cloud RDP (TryCloudflare)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75   # 60 min keep-alive + startup buffer. Windows minutes cost 2x.

    steps:
      - name: Setup RDP account and firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "CynetAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "CynetAdmin" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: Start TryCloudflare RDP tunnel and keep alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflared

          $outLog = "$env:RUNNER_TEMP\cf.out"
          $errLog = "$env:RUNNER_TEMP\cf.err"

          $proc = Start-Process -FilePath $cloudflared `
            -ArgumentList "tunnel --url rdp://localhost:3389 --no-autoupdate" `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -PassThru -NoNewWindow

          $tunnelUrl = $null
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 2
            $text = ""
            if (Test-Path $outLog) { $text += Get-Content $outLog -Raw }
            if (Test-Path $errLog) { $text += Get-Content $errLog -Raw }
            if ($text -match 'https://[a-z0-9-]+\.trycloudflare\.com') { $tunnelUrl = $Matches[0]; break }
            if ($proc.HasExited) { throw "cloudflared exited early: $($proc.ExitCode)" }
          }
          if (-not $tunnelUrl) { throw "Could not parse trycloudflare URL" }

          Write-Host "================================================" -ForegroundColor Green
          Write-Host " Tunnel URL : $tunnelUrl" -ForegroundColor Yellow
          Write-Host " Username   : CynetAdmin" -ForegroundColor Yellow
          Write-Host " Password   : Cynet@2026" -ForegroundColor Yellow
          Write-Host " Client cmd : cloudflared access rdp --hostname $tunnelUrl --url localhost:13389" -ForegroundColor Magenta
          Write-Host " RDP target : mstsc /v:localhost:13389" -ForegroundColor Magenta
          Write-Host "================================================" -ForegroundColor Green

          $summary = @(
            "### RDP via TryCloudflare"
            "- **URL**: ``$tunnelUrl``"
            "- **User**: ``CynetAdmin``  **Pass**: ``Cynet@2026``"
            "- **Client**: ``cloudflared access rdp --hostname $tunnelUrl --url localhost:13389``"
            "- **Connect**: ``mstsc /v:localhost:13389``"
          ) -join "`n"
          Add-Content $env:GITHUB_STEP_SUMMARY $summary

          # 60 min keep-alive (was 360)
          for ($i = 1; $i -le 60; $i++) {
            if ($proc.HasExited) { throw "cloudflared exited: $($proc.ExitCode)" }
            Start-Sleep -Seconds 60
            Write-Host "[$i/60] alive"
          }
